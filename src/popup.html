<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LingoSprout</title><link rel="stylesheet" href="popup.css"></head><body><main><header><img src="../assets/icon.svg" width="38" height="38" alt=""><div><h1>LingoSprout</h1><p>Grow a little with every read.</p></div></header><div class="mode" id="mode">Demo examples · on device</div><p class="intro">Open a public article, choose your preferences, then activate this page.</p><section class="settings"><label class="full">Language pair<select id="pair"><option value="en-zh">English → Chinese</option><option value="sk-en">Slovak → English</option><option value="th-zh">Thai → Chinese</option></select></label><label>Level<select id="level"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option><option>C2</option></select></label><label>Learning goal<select id="goal"><option value="exam">Exam</option><option value="career" selected>Career</option><option value="settlement">Settlement</option><option value="interest">Interest</option></select></label><label class="full">Maximum selected words<select id="density"><option value="3">3 · light</option><option value="6" selected>6 · balanced</option><option value="10">10 · immersive</option></select></label></section><label class="lock"><input type="checkbox" id="lock" checked>Keep my word limit fixed</label><button class="primary" id="activate">Activate this page</button><button class="secondary" id="restore">Restore original text</button><p id="status" role="status" aria-live="polite">Access is limited to the page you activate.</p><div class="links"><button id="demo">Open demo article</button><button id="profile">My learning space ↗</button></div><footer id="privacy">Curated demo mode. No page text is uploaded.</footer></main><script src="storage.js"></script><script src="popup.js"></script></body></html>
